:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin:18px 0 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:18px;min-height:124px;position:relative;overflow:hidden}.kpi .label{font-size:12px;color:var(--muted);font-weight:650}.kpi .value{font-size:25px;font-weight:750;letter-spacing:-.04em;margin:9px 0 5px}.kpi .hint{font-size:11px;color:var(--muted)}.kpi .bubble{position:absolute;right:15px;top:15px;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;color:var(--accent)}.dashgrid{grid-template-columns:1.3fr 1fr;align-items:stretch}.section{padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h2{font-size:15px;margin:0}.muted{color:var(--muted)}.stagebar{display:grid;gap:12px}.stage-row{display:grid;grid-template-columns:170px 1fr 34px;gap:12px;align-items:center;font-size:12px}.track{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:20px}.alert-list{display:grid;gap:9px}.alert{display:flex;gap:10px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}.alert.danger .dot{background:var(--danger)}.alert strong{display:block;font-size:12px}.alert small{color:var(--muted);font-size:11px}.toolbar{display:flex;align-items:center;justify-cont ine);border-radius:13px;padding:11px;min-height:300px}.kan-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:750;margin:2px 2px 12px}.kan-cards{display:grid;gap:9px}.kan-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.kan-card:hover{border-color:var(--accent)}.kan-card h3{font-size:12px;line-height:1.45;margin:8px 0}.kan-card .meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#07101dcc;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(1000px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 100px #0005}.modalhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2}.modalhead h2{font-size:17px;margin:0}.modalbody{padding:22px}.modalfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--panel)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.formgroup{display:grid;gap:6px}.formgroup label{font-size:11px;font-weight:750;color:var(--muted)}.formgroup input,.formgroup select,.formgroup textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);color:var(--text)}.formgroup textarea{min-height:80px;resize:vertical}.formgroup.span2{grid-column:span 2}.formgroup.span3{grid-column:1/-1}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button{padding:8px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;font-weight:700}.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}.detail-section{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:13px}.detail-section h3{margin:0 0 13px;font-size:13px}.comments{display:grid;gap:9px}.comment{padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}.comment strong{font-size:11px}.comment p{margin:5px 0;font-size:12px;white-space:pre-wrap}.comment small{color:var(--muted);font-size:10px}.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--panel);padding:12px 16px;border-radius:10px;z-index:50;box-shadow:var(--shadow);max-width:360px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(470px,100%);padding:28px}.login img{max-width:250px;max-height:75px;object-fit:contain;object-position:left}.login h1{font-size:23px;margin:24px 0 5px}.login p{color:var(--muted);font-size:13px}.login .formgroup{margin:12px 0}.config-note{background:color-mix(in srgb,var(--warn) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 25%,var(--line));padding:12px;border-radius:10px;font-size:12px;color:var(--text)}.reportcards{grid-template-columns:repeat(3,minmax(0,1fr))}.report{padding:16px}.report h3{font-size:13px;margin:0 0 8px}.report p{font-size:12px;color:var(--muted);min-height:34px}.mobile-menu{display:none}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dashgrid{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:15;inset:0 auto 0 0;width:260px;box-shadow:0 0 0 100vw #07101d88}.mobile-menu{display:inline-flex}.topbar{height:68px;padding:0 14px}.topbar h1{font-size:17px}.content{padding:16px 12px 30px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{padding:13px;min-height:110px}.kpi .value{font-size:21px}.top-actions .hide-mobile{display:none}.formgrid{grid-template-columns:1fr 1fr}.formgroup.span3{grid-column:1/-1}.reportcards{grid-template-columns:1fr}.stage-row{grid-template-columns:115px 1fr 22px}.filters input{min-width:100%;}.filters{width:100%}.filters select{flex:1;min-width:0}.toolbar .btn{flex:1;justify-content:center}.modalback{padding:0}.modal{max-height:100vh;height:100vh;border-radius:0}.modalbody{padding:14px}.modalhead,.modalfoot{padding:13px 15px}}

/* ===== v2 additions ===== */
html{-webkit-text-size-adjust:100%;color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3{letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.btn{transition:border-color .15s,color .15s,background .15s,transform .05s}.btn:active{transform:translateY(1px)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}.btn.dangerfill:hover{color:#fff;filter:brightness(1.08)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* stage pills */
.pill.stg{color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--panel));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.pill.stg::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;align-self:center}
.pill.tag{font-weight:650}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:9px;z-index:90;max-width:min(390px,calc(100vw - 36px))}
.toast{position:static;display:flex;gap:10px;align-items:flex-start;background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 14px;border-radius:11px;box-shadow:0 14px 38px #0003;animation:slidein .18s ease;cursor:pointer;font-size:13px;max-width:none}
.toast .ti{font-weight:800;line-height:1.35}
.toast.ok{border-left-color:var(--accent2)}.toast.ok .ti{color:var(--accent2)}
.toast.err{border-left-color:var(--danger)}.toast.err .ti{color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}.toast.warn .ti{color:var(--warn)}

/* dialogs */
.dlgback{position:fixed;inset:0;background:#07101dcc;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 90px #0006;max-height:90vh;display:flex;flex-direction:column;animation:slidein .16s ease}
.dlghead{padding:18px 20px 0}.dlghead h3{margin:0;font-size:16px}
.dlgbody{padding:10px 20px 4px;overflow:auto;color:var(--muted);line-height:1.55;font-size:13px}
.dlgbody .field,.dlgbody input,.dlgbody select{width:100%}
.dlgbody b,.dlgbody strong{color:var(--text)}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;flex-wrap:wrap}
.dlg .list{display:grid;gap:8px;margin-top:6px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--panel2) 30%,var(--line) 50%,var(--panel2) 70%);background-size:300% 100%;animation:sk 1.3s infinite linear;border-radius:10px}

/* table */
.tablewrap.tall{max-height:calc(100vh - 240px)}
th{z-index:1}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--accent)}
th .arrow{opacity:.3;margin-left:4px;font-size:9px}th.sorted{color:var(--accent)}th.sorted .arrow{opacity:1}
tr.rowlink{cursor:pointer}
.resultcount{margin:0 0 10px;font-size:12px}
.keydate{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.kdl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.keydate b{font-weight:650}
.empty{padding:34px 18px}.empty .eico{font-size:34px;opacity:.55;margin-bottom:6px}.empty h3{margin:4px 0;color:var(--text);font-size:15px}.empty p{margin:0 0 12px}

/* sidebar user */
.sideuser{display:flex;gap:10px;align-items:center}.sideuser .avatar{flex:none}.sideuser b{display:block;color:var(--text);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.avatar{cursor:default}button.avatar{cursor:pointer}

/* modal layout */
.modal{display:flex;flex-direction:column;overflow:hidden}
.modalhead{position:static}.modalfoot{position:static}
.modalbody{overflow:auto;flex:1}
.modaltabs{padding:12px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel)}
.modaltabs .tabs{flex-wrap:nowrap;margin:0;padding-bottom:12px}.tabs button{white-space:nowrap}
.stepno{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:color-mix(in srgb,currentColor 16%,transparent);font-size:10px;margin-right:6px}
.stepper{display:flex;gap:4px;margin-top:9px;align-items:center}
.stepper i{height:4px;width:30px;border-radius:4px;background:var(--line)}.stepper i.on{background:var(--c,var(--accent))}
.stepper span{font-size:11px;color:var(--muted);margin-left:8px}
.formgroup label .req{color:var(--danger);margin-left:2px}
.formgroup input.invalid,.formgroup select.invalid,.formgroup textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 14%,transparent)}
.formgroup input:focus,.formgroup select:focus,.formgroup textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);outline:none}
.hint{font-size:11px;color:var(--muted)}
.mtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* kanban */
.kanban{grid-template-columns:repeat(var(--n,5),minmax(250px,1fr))}
.kan-col{border-top:3px solid var(--c,var(--line));transition:outline-color .1s}
.kan-col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.kan-card{cursor:grab}.kan-card.dragging{opacity:.4}
.kan-card .kdrow{margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:6px}

/* timeline */
.tl{display:grid}
.tl-item{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.tl-item:last-child{border-bottom:0}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
.tl-item.done .tl-dot{background:var(--accent2);border-color:var(--accent2)}
.tl-item.next .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.tl-item.next{font-weight:700}

/* login */
.loginwrap{background:radial-gradient(1100px 480px at 15% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(900px 400px at 100% 110%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent),var(--bg)}
.login{box-shadow:0 24px 70px #15243b1f}
.pwwrap{position:relative}.pwwrap input{padding-right:64px}.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:6px 8px;border-radius:7px}
.errbox{background:color-mix(in srgb,var(--danger) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));color:var(--danger);padding:10px 12px;border-radius:10px;font-size:12px;margin:12px 0;font-weight:600}
.checkrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 14px}.checkrow input{width:16px;height:16px;accent-color:var(--accent)}

/* admin: recipients */
.rc{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rc:last-of-type{border-bottom:0}
.switch{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
.logrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.subhead{font-size:13px;margin:20px 0 6px}

/* print */
#printArea{display:none}
@media print{
 body{background:#fff!important;color:#111!important}
 body.printing #root,body.printing .modalback,body.printing .dlgback,body.printing #toasts{display:none!important}
 body.printing #printArea{display:block}
 #printArea{font:12px/1.5 Inter,Arial,sans-serif;color:#111;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #printArea .phead{display:flex;gap:18px;align-items:center;border-bottom:2px solid #0877c9;padding-bottom:12px;margin-bottom:14px}
 #printArea .phead img{max-height:54px;max-width:190px}
 #printArea h1{font-size:19px;margin:0 0 3px}#printArea h2{font-size:14px;margin:18px 0 6px}#printArea h3{font-size:12px;margin:16px 0 5px;text-transform:uppercase;letter-spacing:.06em;color:#0877c9;border-bottom:1px solid #cbd5e1;padding-bottom:3px}
 #printArea table{width:100%;border-collapse:collapse;min-width:0}
 #printArea td,#printArea th{padding:5px 8px;border:1px solid #e2e8f0;font-size:11px;vertical-align:top;position:static;background:#fff;color:#111;text-transform:none;letter-spacing:0}
 #printArea th{background:#f1f5f9;font-weight:700;text-align:left}
 #printArea td.k{width:32%;color:#475569;background:#f8fafc}
 #printArea .pfoot{margin-top:18px;font-size:10px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:6px}
 #printArea tr{page-break-inside:avoid}
}

</style>
</head>
<body>
<div id="root"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

/* ===== ALERT RULES (shared verbatim by the web app and the send-alerts Edge Function) ===== */
function computeAlerts(projects,settings,diff){
 const S=settings||{},out=[];
 const tenderDays=Number(S.alertTenderDays??2),dlpDays=Number(S.alertDlpDays??30),bgDays=Number(S.alertBgDays??30);
 const TENDER="E-Tendering & Procurement",CLOSE="Handover & Closeout";
 for(const p of projects||[]){
  const base={code:p.code||"—",name:p.name||""};
  if(p.stage===TENDER){
   const c=[["Bid closing",p.bidClosingDate],["Tender opening",p.tenderOpenDate]].map(([l,v])=>[l,diff(v)]).filter(([l,d])=>d!==null&&d>=0&&d<=tenderDays).sort((a,b)=>a[1]-b[1])[0];
   if(c)out.push({...base,type:"danger",kind:"tender",title:"Tender deadline approaching",detail:`${c[0]} ${c[1]===0?"is today":`in ${c[1]} day(s)`}`});
  }
  const due=diff(p.scheduledCompletion);
  if(due!==null&&due<0&&Number(p.progress||0)<100&&!p.actualCompletion&&p.stage!==CLOSE)out.push({...base,type:"danger",kind:"overdue",title:"Execution milestone overdue",detail:`${Math.abs(due)} day(s) past scheduled completion`});
  const bg=diff(p.bgExpiry);
  if(bg!==null&&bg>=0&&bg<=bgDays)out.push({...base,type:bg<=7?"danger":"",kind:"bg",title:"Bank guarantee expiring",detail:bg===0?"Expires today":`Expires in ${bg} day(s)`});
  const dlp=diff(p.dlpExpiry);
  if(dlp!==null&&dlp>=0&&dlp<=dlpDays)out.push({...base,type:"",kind:"dlp",title:"DLP expiry approaching",detail:dlp===0?"Expires today":`${dlp} day(s) remaining`});
 }
 const rank={danger:0,"":1};
 return out.sort((a,b)=>rank[a.type]-rank[b.type]);
}

function ymd(v){if(!v)return null;const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d))return null;return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

function dayDiff(v){const s=ymd(v);if(!s)return null;const[a,b,c]=s.split("-").map(Number),[x,y,z]=todayStr().split("-").map(Number);return Math.round((Date.UTC(a,b-1,c)-Date.UTC(x,y-1,z))/86400000)}

function toast(msg,type){
 type=type||(/\b(saved|imported|posted|deleted|added|sent|updated|removed|restored|reconnecting)\b/i.test(msg)?"ok":"info");
 const box=$("#toasts"),t=document.createElement("div");t.className="toast "+type;
 const icon={ok:"✓",err:"✕",warn:"!",info:"ℹ"}[type]||"ℹ";
 t.innerHTML=`<span class="ti">${icon}</span><span>${esc(msg)}</span>`;t.onclick=()=>t.remove();
 box.append(t);setTimeout(()=>t.remove(),type==="err"?7000:4000);
}
const dlgStack=[];
function dialog({title,body="",buttons=[{label:"OK",value:true,primary:true}],width=440,onOpen,cancelValue=null,dismissable=true}){
 return new Promise(res=>{
  const back=document.createElement("div");back.className="dlgback";
  const prev=document.activeElement,id="d"+Math.random().toString(36).slice(2,8);
  back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="${id}" style="width:min(${width}px,100%)"><div class="dlghead"><h3 id="${id}">${esc(title)}</h3></div><div class="dlgbody">${body}</div><div class="dlgfoot">${buttons.map((b,i)=>`<button type="button" class="btn ${b.primary?"primary":""} ${b.danger?"dangerfill":""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
  const entry={cancelValue,close(v){const k=dlgStack.indexOf(entry);if(k>=0)dlgStack.splice(k,1);back.remove();try{prev?.focus?.()}catch{}res(v)}};
  back.addEventListener("mousedown",e=>{if(e.target===back&&dismissable)entry.close(cancelValue)});
  $$("[data-i]",back).forEach(btn=>btn.onclick=()=>{const b=buttons[+btn.dataset.i];entry.close(typeof b.value==="function"?b.value(back):b.value)});
  document.body.append(back);dlgStack.push(entry);
  if(onOpen)onOpen(back,entry.close);
  ($("[autofocus],input:not([type=hidden]),select,textarea",back)||$(".btn.primary",back)||$(".btn",back))?.focus();
 });
}

/* ================= Backend connection & auth ================= */
function waitForSupabase(ms=9000){return new Promise((res,rej)=>{const t0=Date.now();(function chk(){if(window.supabase?.createClient)return res();if(Date.now()-t0>ms)return rej(new Error("Could not load the Supabase library. Check your internet connection and reload."));setTimeout(chk,100)})()})}
const getRemember=()=>safeLS.get(REMEMBER_KEY)!=="0";
function makeClient(remember){
 let storage;try{storage=remember?window.localStorage:window.sessionStorage}catch{storage=undefined}
 supa=window.supabase.createClient(config.url,config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage}});
 authBound=false;bindAuth();
}
function bindAuth(){
 if(authBound)return;authBound=true;
 supa.auth.onAuthStateChange((ev,s)=>{
  if(ev==="SIGNED_OUT"){if(session){session=null;profile=null;stopRealtime();renderLogin("Your session has ended. Please sign in again.")}}
  else if(s)session=s;
 });
}
async function boot(){
 applyTheme();

 if(!config.url||!config.key){renderConnect();return}
 renderSkeleton();
 try{
  await waitForSupabase();makeClient(getRemember());

  if(session)await enterApp();else renderLogin();
 }catch(e){renderConnect("Connection error: "+(e.message||e))}
}

  .on("postgres_changes",{event:"*",schema:"public",table:"projects"},queueReload)

/* ================= Stage / key-date helpers ================= */
function stageIdx(s){const i=activeStages().indexOf(s);return i<0?0:i}
const stageColor=s=>STAGE_COLORS[stageIdx(s)%STAGE_COLORS.length];
function stagePill(s){s=s||activeStages()[0];return `<span class="pill stg" style="--c:${stageColor(s)}">${esc(s)}</span>`}
function progressView(n){n=Number(n)||0;return `<div class="progress"><div class="track"><div class="fill" style="width:${Math.min(100,n)}%;background:var(--accent2)"></div></div><span class="mono">${n}%</span></div>`}
function keyDate(p){
 const pick=(...pairs)=>{for(const[l,k,dl]of pairs){const d=ymd(p[k]);if(d)return{label:l,date:d,deadline:!!dl}}return null};
 switch(p.stage){
  case"Handover & Closeout":return pick(["DLP expiry","dlpExpiry",1],["Completed","completionDate"]);
  case"Work Execution & Monitoring":return pick(["Due","scheduledCompletion",1],["Work order","workOrderDate"]);
  case"E-Tendering & Procurement":return pick(["Bid closing","bidClosingDate",1],["Tender opening","tenderOpenDate",1],["Tender floated","tenderFloatDate"]);
  case"Administrative & Technical Approval":return pick(["Approval","approvalDate"],["Indent","indentDate"]);
  case"Estimation":return pick(["Indent","indentDate"]);
  default:return pick(["Due","scheduledCompletion",1],["Tender opening","tenderOpenDate",1],["Work order","workOrderDate"]);
 }
}
function keyDateChip(p){
 const k=keyDate(p);if(!k)return `<span class="muted">—</span>`;
 const d=dayDiff(k.date);let note="",cls="";
 if(k.deadline&&d!==null){
  if(d<0){if(k.label==="Due"&&Number(p.progress)<100){cls="red";note=`${-d}d overdue`}else note=`${-d}d ago`}
  else if(d<=7){cls="orange";note=d===0?"today":`in ${d}d`}else note=`in ${d}d`;
 }
 return `<div class="keydate"><span class="kdl">${esc(k.label)}</span><b>${datefmt(k.date)}</b>${note?`<span class="pill ${cls}">${note}</span>`:""}</div>`;
}

async function changeStage(id,stage){

function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`}
function download(name,content,type="text/csv;charset=utf-8;"){const b=new Blob([type.startsWith("text/csv")?"\ufeff"+content:content],{type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const stamp=()=>todayStr();
function allDefs(){return FORM.flatMap(s=>s.f.map(fd))}
function exportVal(p,d){const v=p[d.k];if(v===null||v===undefined)return "";if(d.t==="datetime-local")return toLocalDT(v).replace("T"," ");if(d.t==="date")return ymd(v)||"";return v}

 const defs=allDefs(),cf=state.settings.customFields||[];
 return {head:[...defs.map(d=>d.l),...cf.map(c=>c.name),"Last updated","Updated by"],rows:state.projects.map(p=>[...defs.map(d=>exportVal(p,d)),...cf.map(c=>p.custom?.[c.name]??""),p.updated_at||"",p.updated_by_name||""])};

let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();return xlsxP||(xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error("Could not load the Excel library"))};document.head.append(s)}))}
async function exportXLSX(){
 try{
  await loadXLSX();const wb=XLSX.utils.book_new();
  const add=(name,t)=>{const ws=XLSX.utils.aoa_to_sheet([t.head,...t.rows]);ws["!cols"]=t.head.map((h,i)=>({wch:Math.min(48,Math.max(String(h).length+2,...t.rows.slice(0,60).map(r=>String(r[i]??"").length+1)))}));if(t.rows.length)ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:t.rows.length,c:t.head.length-1}})};XLSX.utils.book_append_sheet(wb,ws,name)};
  add("Projects",exportTable());add("Financials",financialTable());add("Alerts",alertsTable());
  XLSX.writeFile(wb,`Technopark_Project_Register_${stamp()}.xlsx`);toast("Excel workbook downloaded.","ok");
 }catch(e){toast(e.message+" — exporting CSV instead.","warn");exportCSV()}

function backupJSON(){download(`Technopark_ProjectTracker_Backup_${stamp()}.json`,JSON.stringify({exportedAt:new Date().toISOString(),projects:state.projects,comments:state.comments,settings:state.settings},null,2),"application/json");toast("Backup downloaded.","ok")}
async function importJSON(file){
 if(!file)return;
 try{
  const d=JSON.parse(await file.text());if(!Array.isArray(d.projects))throw Error("This doesn't look like a Tracker backup file.");
  if(!await ui.confirm({title:"Restore from backup?",message:`Import ${d.projects.length} projects? Projects with the same ID will be replaced by the backup version.`,confirmText:"Restore"}))return;
  if(config.demo){for(const p of d.projects){const i=state.projects.findIndex(x=>projId(x)===projId(p));i>=0?state.projects[i]=normalize(p):state.projects.unshift(normalize(p))}persistLocal()}
  else{const rows=d.projects.map(p=>cleanForDb({...p,id:p.id||crypto.randomUUID()}));const {error}=await supa.from("projects").upsert(rows);if(error)throw error;await loadCloud()}
  if(d.settings&&isAdmin()){state.settings={...state.settings,...d.settings};await saveSettings()}
  refreshContent();toast(`${d.projects.length} projects imported.`,"ok");
 }catch(e){toast("Import failed: "+(e.message||e),"err")}
}

function doPrint(html){
 let a=$("#printArea");if(!a){a=document.createElement("div");a.id="printArea";document.body.append(a)}
 a.innerHTML=html;document.body.classList.add("printing");
 const done=()=>{document.body.classList.remove("printing");window.removeEventListener("afterprint",done)};window.addEventListener("afterprint",done);
 setTimeout(()=>window.print(),80);
}
const printHead=(title,sub)=>`<div class="phead">${logo()}<div><h1>${esc(title)}</h1><div>${sub}</div></div></div>`;
const printFoot=()=>`<div class="pfoot">Generated ${new Date().toLocaleString("en-IN")} by ${esc(profile?.full_name||profile?.email||"—")} · Technopark Electrical Project Tracker</div>`;
function fmtField(p,d){
 let v=d.k.startsWith("custom.")?p.custom?.[d.k.slice(7)]:p[d.k];if(v===null||v===undefined||v==="")return "";
 if(d.t==="money")return Number(v)?money(v):"";if(d.t==="pct")return Number(v)?v+"%":"";if(d.t==="number")return Number(v)?String(v):"";
 if(d.t==="date")return datefmt(v);if(d.t==="datetime-local")return new Date(v).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
 return String(v);
}
function printProject(id){
 const p=findProject(id);if(!p)return;
 const secs=FORM.map(s=>{const rows=s.f.map(fd).map(d=>{const v=fmtField(p,d);return v?`<tr><td class="k">${esc(d.l)}</td><td>${esc(v)}</td></tr>`:""}).join("");return rows?`<h3>${esc(s.title)}</h3><table>${rows}</table>`:""}).join("");
 const cf=(state.settings.customFields||[]).map(c=>p.custom?.[c.name]?`<tr><td class="k">${esc(c.name)}</td><td>${esc(p.custom[c.name])}</td></tr>`:"").join("");
 const cm=state.comments.filter(c=>c.project_id===p.id||c.project_code===p.code).slice(0,8);
 doPrint(printHead(p.name,`${esc(p.code||"")} · ${esc(p.stage||"")}${p.progress?` · ${p.progress}% complete`:""}`)+secs+(cf?`<h3>Custom fields</h3><table>${cf}</table>`:"")+(cm.length?`<h3>Latest comments</h3><table>${cm.map(c=>`<tr><td class="k">${esc(c.author_name||"")}<br>${datefmt(c.created_at)}</td><td>${esc(c.body||"")}</td></tr>`).join("")}</table>`:"")+printFoot());
}
function printRegister(){
 const ps=sortProjects(state.projects);
 doPrint(printHead("Project register",`${ps.length} projects · ${new Date().toLocaleDateString("en-IN",{dateStyle:"long"})}`)+`<table><thead><tr><th>Code</th><th>Project</th><th>Stage</th><th>Agency</th><th>Progress</th><th>Sanctioned</th><th>Key date</th></tr></thead><tbody>${ps.map(p=>{const k=keyDate(p);return `<tr><td>${esc(p.code||"")}</td><td>${esc(p.name||"")}</td><td>${esc(p.stage||"")}</td><td>${esc(p.agency||"")}</td><td>${p.progress||0}%</td><td>${money(p.sanctionedCost||p.estimatedBudget)}</td><td>${k?esc(k.label)+": "+datefmt(k.date):""}</td></tr>`}).join("")}</tbody></table>`+printFoot());
}

function cleanForDb(p){

 }

/* ================= Saving (with conflict detection) ================= */
async function cloudSave(o,expectedUpdatedAt,isNew,force){
 o=cleanForDb(o);
 if(isNew){const {error}=await supa.from("projects").insert(o);return {error}}
 if(force){const {error}=await supa.from("projects").upsert(o);return {error}}
 const {data,error}=await supa.from("projects").update(o).eq("id",o.id).eq("updated_at",expectedUpdatedAt).select("id");
 if(error)return {error};
 if(!data||!data.length)return {conflict:true};
 return {};
}
function setSaving(on){state.saving=on;const b=$("#saveBtn");if(b){b.disabled=on;b.innerHTML=on?'<span class="spin"></span> Saving…':"Save project"}}
async function saveProjectForm(){
 if(state.saving)return;
 const old=state.editing||{},isNew=!state.editing;
 const o=formObject(),errs=validateForm(o,old);if(errs.length)return focusField(errs[0]);
 const now=new Date().toISOString();
 o.name=o.name.trim();o.id=old.id||crypto.randomUUID();o.code=(o.code||"").trim()||nextCode();o.created_at=old.created_at||now;o.updated_at=now;
 o.updated_by=session?.user?.id||"local-admin";o.updated_by_name=profile?.full_name||profile?.email||"Local Admin";
 setSaving(true);
 try{
  if(config.demo){const i=state.projects.findIndex(p=>String(projId(p))===String(projId(old)));const merged=normalize({...old,...o});if(i>=0)state.projects[i]=merged;else state.projects.unshift(merged);persistLocal()}
  else{
   let r=await cloudSave(o,old.updated_at,isNew,false);
   if(r.conflict){
    let who="someone else",when="";try{const {data}=await supa.from("projects").select("updated_by_name,updated_at").eq("id",o.id).maybeSingle();if(data){who=data.updated_by_name||who;when=new Date(data.updated_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}}catch{}
    const choice=await dialog({title:"This project was changed by someone else",width:480,cancelValue:"keep",body:`<div><b>${esc(who)}</b> saved changes${when?` at <b>${esc(when)}</b>`:""} while you were editing.<br><br>If you overwrite, their changes to this project will be lost. If you keep editing, you can copy what you need first — the latest version is on the Projects page.</div>`,buttons:[{label:"Keep editing",value:"keep",primary:true},{label:"Overwrite their changes",value:"overwrite",danger:true}]});
    if(choice!=="overwrite")return;
    r=await cloudSave(o,null,false,true);
   }
   if(r.error)throw r.error;
   await loadCloud();
  }
  state.dirty=false;closeModal();refreshContent();toast("Project saved.","ok");
 }catch(e){toast(e.message||String(e),"err")}
 finally{setSaving(false)}
}
async function deleteProject(id){
 if(!isAdmin())return toast("Only workspace admins can delete projects.","err");
 const p=findProject(id);if(!p)return;
 if(!await ui.confirm({title:"Delete this project?",message:`“${p.name}” (${p.code||"no code"}) and its record will be permanently removed. This cannot be undone.`,confirmText:"Delete project",danger:true}))return;
 try{
  if(config.demo){state.projects=state.projects.filter(x=>x!==p);persistLocal()}
  else{const {error}=await supa.from("projects").delete().eq("id",p.id);if(error)throw error;await loadCloud()}
  closeModal();refreshContent();toast("Project deleted.","ok");
 }catch(e){toast(e.message||String(e),"err")}
}

function setAdminTab(k){state.adminTab=k;refreshContent();if(k==="alerts")loadEmailData()}
function adminFields(){return `<div class="card section"><div class="section-head"><h2>Lifecycle stages</h2><button class="btn small" onclick="addStage()">＋ Add stage</button></div><p class="muted">Stages appear in the project form, master table and pipeline board. Existing project stages are not automatically renamed.</p>${activeStages().map((s,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:8px 0"><span class="pill stg" style="--c:${STAGE_COLORS[i%STAGE_COLORS.length]}">${i+1}</span><input class="field" style="flex:1" id="stage${i}" value="${esc(s)}" aria-label="Stage ${i+1}"><button class="btn small" onclick="moveStage(${i},-1)" ${i===0?"disabled":""} aria-label="Move up">↑</button><button class="btn small" onclick="moveStage(${i},1)" ${i===activeStages().length-1?"disabled":""} aria-label="Move down">↓</button><button class="btn small danger" onclick="removeStage(${i})" aria-label="Remove stage">×</button></div>`).join("")}<button class="btn primary" style="margin-top:10px" onclick="saveStages()">Save stages</button></div>
 <div class="card section" style="margin-top:14px"><div class="section-head"><h2>Custom project fields</h2><button class="btn small" onclick="addCustomField()">＋ Add field</button></div><p class="muted">Create fields such as feeder name, building, internal reference, or review status. Values are stored with each project.</p>${(state.settings.customFields||[]).map((f,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap"><input class="field" id="cfname${i}" value="${esc(f.name)}" placeholder="Field label" aria-label="Field label"><select class="field" id="cftype${i}" aria-label="Field type">${["text","number","date","url","select","textarea"].map(t=>`<option ${f.type===t?"selected":""}>${t}</option>`).join("")}</select><label class="switch"><input type="checkbox" id="cfreq${i}" ${f.required?"checked":""}> Required</label><input class="field" id="cfopts${i}" value="${esc((f.options||[]).join(", "))}" placeholder="Options for select (comma separated)"><button class="btn small danger" onclick="removeCustomField(${i})" aria-label="Remove field">×</button></div>`).join("")||`<div class="empty">No custom fields configured.</div>`}<button class="btn primary" style="margin-top:10px" onclick="saveCustomFields()">Save custom fields</button></div>`}
function adminCategories(){return `<div class="card section"><div class="section-head"><h2>Project categories</h2><button class="btn small" onclick="addCategory()">＋ Add category</button></div><p class="muted">Manage category options available to engineers.</p>${categoriesList().map((c,i)=>`<div style="display:flex;gap:8px;margin:8px 0"><input class="field" id="cat${i}" value="${esc(c)}" style="flex:1" aria-label="Category ${i+1}"><button class="btn small danger" onclick="removeCategory(${i})">Remove</button></div>`).join("")}<button class="btn primary" style="margin-top:10px" onclick="saveCategories()">Save categories</button></div>`}
function adminUsers(){return `<div class="card section"><div class="section-head"><h2>Team & role management</h2><button class="btn" onclick="loadUsers()">↻ Refresh users</button></div><p class="muted">Create accounts in Supabase → Authentication → Users. The profile trigger creates an Engineer profile. To grant admin access, update the role in the profiles table (see the setup guide).</p><button class="btn" style="margin-top:12px" onclick="seedCloudProjects()">＋ Import 10 starter projects</button><div class="config-note" style="margin-top:14px">Suggested team: 1 Admin, 2 Project Engineers, 1 Assistant Manager, 1 AGM and 1 CTO. Add users as required.</div><div id="usersList" style="margin-top:15px">${state.users.length?state.users.map(u=>`<div class="rc"><span class="avatar">${esc(initials(u.full_name||u.email))}</span><div style="flex:1"><b>${esc(u.full_name||u.email)}</b><div class="muted">${esc(u.email||"")}</div></div><span class="pill">${esc(u.role)}</span></div>`).join(""):`<span class="muted">Click “Refresh users” to load permitted profiles.</span>`}</div></div>`}
function adminConnection(){return `<div class="card section"><h2>Cloud connection</h2><p class="muted">The Supabase endpoint is stored in this browser. The publishable key is not a secret; row-level security protects your data.</p><div class="formgrid"><div class="formgroup span2"><label for="adminUrl">Project URL</label><input id="adminUrl" value="${esc(config.url||"")}"></div><div class="formgroup span3"><label for="adminKey">Publishable key (masked)</label><input id="adminKey" type="password" placeholder="Enter a replacement key to update"></div></div><div class="btnrow" style="margin-top:12px"><button class="btn primary" onclick="updateConnection()">Update connection</button><button class="btn danger" onclick="confirmDisconnect()">Disconnect / switch project</button></div></div>`}
async function confirmDisconnect(){if(await ui.confirm({title:"Disconnect this workspace?",message:"You'll be asked to enter connection details again. No data is deleted.",confirmText:"Disconnect",danger:true}))disconnect()}
async function loadUsers(){if(config.demo)return toast("Local demo has no cloud user directory.");const {data,error}=await supa.from("profiles").select("*").order("created_at");if(error)return toast(error.message,"err");state.users=data||[];refreshContent()}
async function saveSettings(){
 if(config.demo){persistLocal();toast("Settings saved locally.","ok");return true}
 const {error}=await supa.from("app_settings").upsert({id:1,config:state.settings,updated_by:session.user.id,updated_at:new Date().toISOString()});
 if(error){toast(error.message,"err");return false}toast("Workspace settings saved.","ok");return true;
}
async function addStage(){const s=await ui.prompt({title:"Add lifecycle stage",label:"Stage name",placeholder:"e.g. Commissioning",confirmText:"Add stage"});if(s?.trim()){state.settings.stages=[...activeStages(),s.trim()];refreshContent()}}
function moveStage(i,d){const a=[...activeStages()],j=i+d;[a[i],a[j]]=[a[j],a[i]];state.settings.stages=a;refreshContent()}
async function removeStage(i){if(activeStages().length<=1)return toast("At least one stage is required.","err");if(await ui.confirm({title:"Remove this stage?",message:"It is removed from the workflow options. Existing projects keep their current stage value.",confirmText:"Remove",danger:true})){state.settings.stages=activeStages().filter((_,j)=>j!==i);refreshContent()}}
function saveStages(){state.settings.stages=activeStages().map((s,i)=>$("#stage"+i)?.value.trim()).filter(Boolean);saveSettings().then(refreshContent)}
function addCustomField(){state.settings.customFields=[...(state.settings.customFields||[]),{name:"New field",type:"text",required:false,options:[]}];refreshContent()}
function removeCustomField(i){state.settings.customFields.splice(i,1);refreshContent()}
function saveCustomFields(){state.settings.customFields=(state.settings.customFields||[]).map((f,i)=>({name:$("#cfname"+i).value.trim(),type:$("#cftype"+i).value,required:$("#cfreq"+i).checked,options:$("#cfopts"+i).value.split(",").map(s=>s.trim()).filter(Boolean)})).filter(f=>f.name);saveSettings().then(refreshContent)}
async function addCategory(){const c=await ui.prompt({title:"Add category",label:"Category name",confirmText:"Add category"});if(c?.trim()){state.settings.categories=[...categoriesList(),c.trim()];refreshContent()}}
function removeCategory(i){state.settings.categories=categoriesList().filter((_,j)=>j!==i);refreshContent()}
function saveCategories(){state.settings.categories=categoriesList().map((c,i)=>$("#cat"+i)?.value.trim()).filter(Boolean);saveSettings().then(refreshContent)}
async function seedCloudProjects(){
 if(!isAdmin())return toast("Admin access required.","err");
 if(config.demo){state.projects=[...SEED.map(normalize),...state.projects];persistLocal();refreshContent();return toast("Starter projects added to the local demo.","ok")}
 if(!await ui.confirm({title:"Import starter projects?",message:"Import the 10 sample register projects into this cloud workspace? Existing records will not be deleted.",confirmText:"Import"}))return;
 const existing=new Set(state.projects.map(p=>p.code)),now=new Date().toISOString();
 const rows=SEED.filter(p=>!existing.has(p.code)).map(p=>cleanForDb({...p,id:crypto.randomUUID(),created_at:now,updated_at:now,updated_by:session.user.id}));
 if(!rows.length)return toast("Starter projects are already present.");
 const {error}=await supa.from("projects").insert(rows);if(error)return toast(error.message,"err");
 await loadCloud();refreshContent();toast(`${rows.length} starter projects imported.`,"ok");
}

/* ---- alert rules + email digest ---- */
function saveAlertSettings(){
 const n=(id,def)=>{const v=Number($("#"+id)?.value);return Number.isFinite(v)&&v>=0?v:def};
 state.settings.alertTenderDays=n("tndDays",2);state.settings.alertDlpDays=n("dlpDays",30);state.settings.alertBgDays=n("bgDays",30);
 saveSettings().then(()=>refreshContent());
}
function saveEmailSettings(){state.settings.alertEmailEnabled=$("#emEnabled").value==="1";state.settings.alertEmailFrequency=$("#emFreq").value;saveSettings().then(()=>refreshContent())}
function adminAlerts(){
 const S=state.settings;
 return `<div class="card section"><h2>Alert rules</h2><p class="muted">These rules drive both the dashboard alerts and the emailed digest.</p><div class="formgrid" style="margin-top:14px"><div class="formgroup"><label for="tndDays">Tender deadline warning (days before)</label><input id="tndDays" type="number" min="0" max="60" value="${Number(S.alertTenderDays??2)}"></div><div class="formgroup"><label for="dlpDays">DLP expiry warning (days before)</label><input id="dlpDays" type="number" min="0" max="365" value="${Number(S.alertDlpDays??30)}"></div><div class="formgroup"><label for="bgDays">Bank guarantee expiry warning (days before)</label><input id="bgDays" type="number" min="0" max="365" value="${Number(S.alertBgDays??30)}"></div></div><div class="config-note" style="margin-top:14px">Execution alerts trigger when the scheduled completion date has passed and progress is below 100%. Tender alerts use the bid closing or tender opening date while a project is in E-Tendering.</div><button class="btn primary" style="margin-top:12px" onclick="saveAlertSettings()">Save alert rules</button></div>${emailCard()}`;
}
function emailCard(){
 if(config.demo)return `<div class="card section" style="margin-top:14px"><h2>Email alerts</h2><p class="muted">Email alerts need the cloud workspace (Supabase) and aren't available in local demo mode.</p></div>`;
 const S=state.settings,rc=state.recipients,on=S.alertEmailEnabled!==false;
 return `<div class="card section" style="margin-top:14px"><div class="section-head"><h2>Email alerts</h2><span class="pill ${on?"green":""}">${on?"Enabled":"Paused"}</span></div><p class="muted">A digest of active alerts is emailed to the addresses below. Nothing is sent on days with no alerts.</p>
 <div class="formgrid" style="margin:14px 0"><div class="formgroup"><label for="emEnabled">Automatic digest</label><select id="emEnabled"><option value="1" ${on?"selected":""}>On</option><option value="0" ${on?"":"selected"}>Paused</option></select></div><div class="formgroup"><label for="emFreq">Send on</label><select id="emFreq"><option value="daily" ${S.alertEmailFrequency==="daily"||!S.alertEmailFrequency?"selected":""}>Every day</option><option value="weekdays" ${S.alertEmailFrequency==="weekdays"?"selected":""}>Weekdays (Mon–Fri)</option><option value="monday" ${S.alertEmailFrequency==="monday"?"selected":""}>Mondays only</option></select></div><div class="formgroup"><label>Send time</label><input value="9:00 AM IST (set by the schedule)" disabled></div></div>
 <button class="btn primary" onclick="saveEmailSettings()">Save email settings</button>
 <h3 class="subhead">Recipients</h3>
 ${rc===null?`<div class="muted">Loading…</div>`:rc.length?rc.map(r=>`<div class="rc"><span class="avatar">${esc(initials(r.name||r.email))}</span><div style="flex:1;min-width:0"><b>${esc(r.name||r.email)}</b><div class="muted" style="overflow:hidden;text-overflow:ellipsis">${esc(r.email)}</div></div><label class="switch"><input type="checkbox" ${r.active?"checked":""} data-act="rcToggle" data-id="${esc(r.id)}"> Active</label><button class="btn small danger" data-act="rcDel" data-id="${esc(r.id)}">Remove</button></div>`).join(""):`<div class="empty" style="padding:16px">No recipients yet — add an email address below.</div>`}
 <div class="formgrid" style="margin-top:14px;grid-template-columns:1fr 1fr auto;align-items:end"><div class="formgroup"><label for="rcEmail">Email address</label><input id="rcEmail" type="email" placeholder="name@company.com" autocomplete="off"></div><div class="formgroup"><label for="rcName">Name (optional)</label><input id="rcName" placeholder="e.g. Assistant Manager"></div><button class="btn primary" onclick="addRecipient()">＋ Add</button></div>
 <div class="btnrow" style="margin-top:16px"><button class="btn" onclick="sendTestEmail()">✉ Send test email</button><button class="btn" onclick="sendDigestNow()">▶ Send today's digest now</button></div>
 ${state.alertLog.length?`<h3 class="subhead">Recent email activity</h3>${state.alertLog.map(l=>`<div class="logrow"><span>${new Date(l.sent_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})} · ${esc(l.mode||"")}</span><span>${esc(l.status||"")} · ${l.recipients||0} recipient(s) · ${l.alerts||0} alert(s)</span></div>`).join("")}`:""}
 <div class="config-note" style="margin-top:16px">Emails are sent by a Supabase Edge Function using your own free email account (Brevo or Resend). If a test email fails, the error message will tell you what's missing — see the setup guide.</div></div>`;
}
async function loadEmailData(){
 if(config.demo||!supa)return;
 const [r,l]=await Promise.all([supa.from("alert_recipients").select("*").order("created_at"),supa.from("alert_log").select("*").order("sent_at",{ascending:false}).limit(5)]);
 if(r.error){state.recipients=[];if(state.adminTab==="alerts")refreshContent();return toast("Couldn't load recipients — have you run the Step 1 SQL? ("+r.error.message+")","err")}
 state.recipients=r.data||[];state.alertLog=l.data||[];if(state.page==="Admin & Settings"&&state.adminTab==="alerts")refreshContent();
}
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
async function addRecipient(){
 const email=$("#rcEmail").value.trim().toLowerCase(),name=$("#rcName").value.trim();
 if(!validEmail(email))return toast("Enter a valid email address.","err");
 const {error}=await supa.from("alert_recipients").insert({email,name:name||null,active:true,created_by:session.user.id});
 if(error)return toast(error.code==="23505"?"That email address is already on the list.":error.message,"err");
 toast("Recipient added.","ok");await loadEmailData();
}
async function fnCall(body){
 const {data,error}=await supa.functions.invoke("send-alerts",{body});
 if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||j.message||msg}catch{}return {error:msg}}
 if(data&&data.ok===false)return {error:data.error||"The function reported a problem."};
 return {data};
}
async function sendTestEmail(){
 const to=await ui.prompt({title:"Send a test email",message:"We'll send a short test message (with today's alerts, if any) to this address.",label:"Email address",value:profile?.email||"",confirmText:"Send test"});
 if(!to)return;if(!validEmail(to.trim()))return toast("Enter a valid email address.","err");
 toast("Sending test email…");const r=await fnCall({mode:"test",to:to.trim()});
 if(r.error)return ui.info("Test email failed",`<div class="errbox">${esc(r.error)}</div><div>Check the setup guide: the function must be deployed, its secrets added (email provider key, sender address), and the sender verified with your email provider.</div>`);
 toast(`Test email sent to ${to.trim()}. Check the inbox (and spam folder).`,"ok");loadEmailData();
}
async function sendDigestNow(){
 if(!await ui.confirm({title:"Send today's digest now?",message:"This emails the current alerts to all active recipients.",confirmText:"Send now"}))return;
 toast("Sending digest…");const r=await fnCall({mode:"digest"});
 if(r.error)return ui.info("Couldn't send the digest",`<div class="errbox">${esc(r.error)}</div>`);
 toast(r.data?.message||`Digest sent to ${r.data?.sent||0} recipient(s).`,"ok");loadEmailData();
}

/* ================= Global events ================= */
const ACT={
 open:id=>openDetail(id),
 edit:id=>openProject(id),
 stage:async id=>{const p=findProject(id);if(!p)return;const s=await ui.select({title:"Change lifecycle stage",message:p.name,options:activeStages(),value:p.stage});if(s&&s!==p.stage)changeStage(id,s)},
 del:id=>deleteProject(id),
 print:id=>printProject(id),
 sort:k=>{state.sort=state.sort.key===k?{key:k,dir:state.sort.dir==="asc"?"desc":"asc"}:{key:k,dir:"asc"};refreshResults()},
 rcToggle:async(id,el)=>{const {error}=await supa.from("alert_recipients").update({active:el.checked}).eq("id",id);if(error){toast(error.message,"err");el.checked=!el.checked}else{const r=state.recipients.find(x=>x.id===id);if(r)r.active=el.checked;toast(el.checked?"Recipient activated.":"Recipient paused.","ok")}},
 rcDel:async id=>{const r=state.recipients.find(x=>x.id===id);if(!await ui.confirm({title:"Remove recipient?",message:`${r?.email||"This address"} will stop receiving alert emails.`,confirmText:"Remove",danger:true}))return;const {error}=await supa.from("alert_recipients").delete().eq("id",id);if(error)return toast(error.message,"err");toast("Recipient removed.","ok");loadEmailData()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.id,el,e)});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(dlgStack.length){const t=dlgStack[dlgStack.length-1];t.close(t.cancelValue)}else if(state.modal==="project")tryCloseModal();else if(state.modal)closeModal()}
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&state.modal==="project")saveProjectForm();
 if((e.key==="Enter"||e.key===" ")&&e.target.matches?.('tr.rowlink[data-act]')){e.preventDefault();e.target.click()}
});
/* drag & drop between pipeline columns */
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".kan-card");if(c){e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";c.classList.add("dragging")}});
document.addEventListener("dragend",e=>{e.target.closest?.(".kan-card")?.classList.remove("dragging");$$(".kan-col.over").forEach(c=>c.classList.remove("over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.(".kan-col");if(c){e.preventDefault();$$(".kan-col.over").forEach(x=>x!==c&&x.classList.remove("over"));c.classList.add("over")}});
document.addEventListener("drop",e=>{const c=e.target.closest?.(".kan-col");if(!c)return;e.preventDefault();c.classList.remove("over");const id=e.dataTransfer.getData("text/plain");if(id)changeStage(id,c.dataset.stage)});
window.addEventListener("beforeunload",e=>{if(state.modal==="project"&&state.dirty){e.preventDefault();e.returnValue=""}});
boot();

</script>
</body>
</html>
